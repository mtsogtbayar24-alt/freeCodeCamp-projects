<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Personal Productivity System</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Space+Mono&display=swap" rel="stylesheet">

<style>

body{
font-family:Inter;
background:linear-gradient(135deg,#0f172a,#020617);
color:#e2e8f0;
padding:40px;
margin:0;
}

h1{
text-align:center;
}

.header{
text-align:center;
margin-bottom:30px;
}

#clock{
font-family:"Space Mono";
font-size:18px;
color:#6ee7f7;
margin-top:10px;
}

.schedule{
max-width:750px;
margin:auto;
display:flex;
flex-direction:column;
gap:12px;
}

.block{
display:flex;
gap:15px;
background:#1e293b;
padding:15px;
border-radius:10px;
align-items:center;
}

.block-time{
min-width:110px;
font-family:"Space Mono";
color:#6ee7f7;
}

.block.active{
outline:2px solid #6ee7f7;
box-shadow:0 0 15px rgba(110,231,247,0.2);
}

input[type=checkbox]{
transform:scale(1.3);
}

.type-coding{border-left:4px solid #6ee7f7;}
.type-class{border-left:4px solid #60a5fa;}
.type-meal{border-left:4px solid #fbbf24;}
.type-gym{border-left:4px solid #34d399;}

#progressBar{
position:fixed;
top:0;
left:0;
height:4px;
background:#6ee7f7;
width:0%;
}

.timer{
margin-top:40px;
text-align:center;
}

.timer button{
padding:10px 20px;
margin:5px;
border:none;
border-radius:6px;
background:#6ee7f7;
cursor:pointer;
}

.habits{
margin-top:40px;
text-align:center;
}

.habit{
margin:10px;
}

</style>
</head>

<body>

<div id="progressBar"></div>

<div class="header">

<h1>My Productivity System</h1>

<div id="clock"></div>

</div>


<div class="schedule">

<div class="block type-coding">
<input type="checkbox" data-id="task1">
<div class="block-time">07:00–08:00</div>
<div>Deep Work (FAANG Coding)</div>
</div>

<div class="block type-class">
<input type="checkbox" data-id="task2">
<div class="block-time">08:00–09:30</div>
<div>Visual Programming</div>
</div>

<div class="block type-class">
<input type="checkbox" data-id="task3">
<div class="block-time">09:40–11:10</div>
<div>Visual Programming Lab</div>
</div>

<div class="block type-class">
<input type="checkbox" data-id="task4">
<div class="block-time">11:20–12:50</div>
<div>Science English</div>
</div>

<div class="block type-coding">
<input type="checkbox" data-id="task5">
<div class="block-time">15:00–17:00</div>
<div>Portfolio / FAANG Prep</div>
</div>

<div class="block type-gym">
<input type="checkbox" data-id="task6">
<div class="block-time">18:00–19:30</div>
<div>Gym</div>
</div>

</div>


<div class="timer">

<h2>Pomodoro Timer</h2>

<div id="timerDisplay">25:00</div>

<button onclick="startTimer()">Start</button>
<button onclick="resetTimer()">Reset</button>

</div>


<div class="habits">

<h2>Habit Tracker</h2>

<div class="habit">
<input type="checkbox" id="nosmoke"> No Smoking
</div>

<div class="habit">
<input type="checkbox" id="noporn"> No Porn
</div>

<div class="habit">
<input type="checkbox" id="gymhabit"> Gym Completed
</div>

</div>


<script>

function convertTime(t){

const [h,m]=t.split(":")
return parseInt(h)*60+parseInt(m)

}

function updateClock(){

const now=new Date()

document.getElementById("clock").innerText=
now.toLocaleTimeString()

highlightTask(now)

updateProgress(now)

}

function highlightTask(now){

const current=now.getHours()*60+now.getMinutes()

document.querySelectorAll(".block").forEach(block=>{

block.classList.remove("active")

const time=block.querySelector(".block-time").innerText

if(!time.includes("–")) return

const[start,end]=time.split("–")

const s=convertTime(start)
const e=convertTime(end)

if(current>=s && current<=e){

block.classList.add("active")

}

})

}

function updateProgress(now){

const minutes=now.getHours()*60+now.getMinutes()

const percent=(minutes/1440)*100

document.getElementById("progressBar").style.width=percent+"%"

}

setInterval(updateClock,1000)


document.querySelectorAll("input[type=checkbox]").forEach(box=>{

const id=box.dataset.id || box.id

if(localStorage.getItem(id)==="true"){
box.checked=true
}

box.addEventListener("change",()=>{

localStorage.setItem(id,box.checked)

})

})


let time=1500
let timer

function startTimer(){

timer=setInterval(()=>{

time--

let m=Math.floor(time/60)
let s=time%60

document.getElementById("timerDisplay").innerText=
`${m}:${s<10?"0":""}${s}`

if(time<=0){

clearInterval(timer)

alert("Pomodoro finished!")

}

},1000)

}

function resetTimer(){

clearInterval(timer)

time=1500

document.getElementById("timerDisplay").innerText="25:00"

}

</script>

</body>
</html>
